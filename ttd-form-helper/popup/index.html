<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTD Form Helper</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <img src="../icons/icon.svg" alt="" class="brand-logo" width="30" height="30" />
          <div class="brand-text">
            <strong id="brand-title">TTD Form Helper</strong>
            <span class="brand-tag" id="brand-tag">Free &middot; No account needed</span>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" id="lock-toggle" class="icon-btn" title="Lock now" aria-label="Lock now" hidden>🔒</button>
          <button type="button" id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
          <button type="button" id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
        </div>
      </header>

      <div class="privacy-banner" id="privacy-banner" role="note"></div>

      <nav class="tab-nav" id="tab-nav" role="tablist"></nav>

      <main id="tab-content" class="tab-content"></main>
    </div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
