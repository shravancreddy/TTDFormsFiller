<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- TTD Form Helper — feature icon.
       Gopuram = TTD bookings · form card with ticked rows = pilgrim details filled ·
       lightning = one-click Fill · paperclip = document / age-proof upload ·
       shield + lock = stored only in this browser, optionally encrypted. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB03B"/>
      <stop offset="1" stop-color="#C42F3B"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB400"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#5a0f14" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- badge -->
  <rect width="128" height="128" rx="29" fill="url(#bg)"/>
  <rect x="0.9" y="0.9" width="126.2" height="126.2" rx="28.2" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="1.8"/>

  <!-- gopuram (TTD), top-left, behind the card -->
  <g fill="#fff" fill-opacity="0.9">
    <circle cx="33" cy="10.5" r="2.3"/>
    <polygon points="25,20 41,20 33,13.5"/>
    <polygon points="25,20 41,20 41,24 25,24"/>
    <polygon points="22.5,25.5 43.5,25.5 45,31.5 21,31.5"/>
    <polygon points="19.5,33 46.5,33 48.5,40.5 17.5,40.5"/>
    <polygon points="15.5,42 50.5,42 53,51 13,51"/>
  </g>

  <!-- form card (pilgrim details) -->
  <g filter="url(#sh)">
    <rect x="22" y="44" width="76" height="68" rx="9" fill="#fff"/>
  </g>
  <!-- card header strip -->
  <rect x="22" y="44" width="76" height="12" rx="9" fill="#7B1113"/>
  <rect x="22" y="50" width="76" height="6" fill="#7B1113"/>
  <circle cx="30" cy="50" r="2.2" fill="#FFB03B"/>
  <rect x="35.5" y="48.6" width="30" height="2.8" rx="1.4" fill="#fff" fill-opacity="0.85"/>

  <!-- rows: avatar · filled field · tick -->
  <g>
    <circle cx="31.5" cy="65" r="4.2" fill="#FBD38D"/>
    <rect x="39" y="62" width="36" height="6" rx="3" fill="#E8D5C4"/>
    <rect x="39" y="62" width="27" height="6" rx="3" fill="#C42F3B" fill-opacity="0.75"/>
    <circle cx="84" cy="65" r="4.6" fill="#1E9E5C"/>
    <polyline points="81.8,65.1 83.4,66.8 86.4,63.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="31.5" cy="78" r="4.2" fill="#FBD38D"/>
    <rect x="39" y="75" width="36" height="6" rx="3" fill="#E8D5C4"/>
    <rect x="39" y="75" width="31" height="6" rx="3" fill="#C42F3B" fill-opacity="0.75"/>
    <circle cx="84" cy="78" r="4.6" fill="#1E9E5C"/>
    <polyline points="81.8,78.1 83.4,79.8 86.4,76.5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- attached document (age proof / photo upload) -->
  <g>
    <path d="M30 88 h15 l5 5 v13 a2 2 0 0 1 -2 2 h-18 a2 2 0 0 1 -2 -2 v-16 a2 2 0 0 1 2 -2 z" fill="#FDEBD3" stroke="#C42F3B" stroke-width="1.3"/>
    <path d="M45 88 v5 h5" fill="none" stroke="#C42F3B" stroke-width="1.3" stroke-linejoin="round"/>
    <rect x="31.5" y="97" width="12" height="2" rx="1" fill="#C42F3B" fill-opacity="0.55"/>
    <rect x="31.5" y="101.5" width="15" height="2" rx="1" fill="#C42F3B" fill-opacity="0.55"/>
    <!-- paperclip -->
    <path d="M53.5 90.5 v12.5 a4 4 0 0 1 -8 0 v-10.5 a2.4 2.4 0 0 1 4.8 0 v9.5" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- continue button hint -->
  <rect x="60" y="95" width="30" height="10" rx="5" fill="#1E9E5C"/>
  <polyline points="72,97.8 75.5,100 72,102.2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="77,97.8 80.5,100 77,102.2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lightning: one-click Fill -->
  <g filter="url(#sh)">
    <circle cx="96" cy="30" r="20" fill="#1E1414"/>
    <circle cx="96" cy="30" r="20" fill="none" stroke="#fff" stroke-width="2.4"/>
    <polygon points="99.5,15.5 86.5,32.5 95,32.5 92,44.5 105.5,26.5 97,26.5" fill="url(#bolt)" stroke="#fff" stroke-width="0.8" stroke-linejoin="round"/>
  </g>

  <!-- shield + lock: local only, encrypted -->
  <g filter="url(#sh)">
    <path d="M106 86 l14 5 v9 c0 9 -6 15.5 -14 19 c-8 -3.5 -14 -10 -14 -19 v-9 z" fill="#1E9E5C" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="100.3" y="99" width="11.4" height="9" rx="1.8" fill="#fff"/>
    <path d="M102.6 99 v-3 a3.4 3.4 0 0 1 6.8 0 v3" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="106" cy="103.2" r="1.4" fill="#1E9E5C"/>
  </g>
</svg>
